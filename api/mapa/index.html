<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de incidentes - Veracruz</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <!-- Copia local de protomaps-leaflet; si no está en la carpeta, se intenta desde internet -->
  <script src="protomaps-leaflet.js"></script>
  <script>window.protomapsL || document.write('<script src="https://unpkg.com/protomaps-leaflet@5.0.0/dist/protomaps-leaflet.js"><\/script>')</script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #232a35; color: #e8ecf1; font-family: system-ui, sans-serif;
    }
    .ventana { width: min(820px, 94vw); padding: 16px 0; }
    #estado { min-height: 20px; margin-bottom: 8px; font-size: 14px; color: #b7c0cd; }
    #mapa {
      height: min(540px, 70vh); border: 3px solid #fff; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
    .leyenda { background: #fff; color: #222; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.7; }
    .leyenda i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  </style>
</head>
<body>

  <div class="ventana">
    <div id="estado" role="status"></div>
    <div id="mapa"></div>
  </div>

  <script>
    /* =====================================================================
       GUÍA PARA LA IA
       Hay dos formas de agregar incidentes (también las describe mapaIncidentes.ayuda()):

       1) ARCHIVO  incidentes.json (en la misma carpeta). La página lo relee cada
          SEGUNDOS_ACTUALIZAR segundos. Es una lista; cada elemento:
            { "id": "morelos-001",            // recomendado y único: mismo id = actualiza
              "severidad": "critico",         // critico (rojo) | urgente (amarillo) | menor (verde)
              "texto": "Choque con heridos",
              "fecha": "2026-11-11T14:30:00", // opcional
              "desde": [19.0749, -96.1605],   // [lat, lng] del primer cruce (o una dirección en texto)
              "hasta": [19.0760, -96.1595] }  // [lat, lng] del segundo cruce (o una dirección en texto)
          En vez de desde/hasta puedes dar "puntos": [[lat,lng], [lat,lng], ...] y se dibuja tal cual.
          Con coordenadas el resultado es más preciso que con direcciones en texto.

       2) FUNCIONES en window.mapaIncidentes (para quien controle el navegador):
            await mapaIncidentes.agregar({ ...igual que arriba... })   // devuelve el id
            mapaIncidentes.eliminar(id) | limpiar() | listar() | enfocar(id) | enfocarTodos()

       CÓMO ELEGIR LA SEVERIDAD
         critico (rojo)    -> extrema importancia: heridos graves, riesgo de vida, bloqueo total.
         urgente (amarillo)-> preocupante pero inmediato: requiere atención pronto, sin riesgo vital.
         menor (verde)     -> importancia menor: molestia leve, tráfico lento, daño sin riesgo.
       ===================================================================== */

    const ARCHIVO_MAPA = 'veracruz.pmtiles';
    const ARCHIVO_DATOS = 'incidentes.json';
    const SEGUNDOS_ACTUALIZAR = 10;   // 0 = leer el archivo solo una vez
    const CENTRO = [19.074870, -96.160514];
    const LIMITES = [[17.1, -98.7], [22.5, -93.6]];   // suroeste y noreste de Veracruz

    const NIVELES = {
      critico: { color: '#d62839', etiqueta: 'Extrema importancia', orden: 3 },
      urgente: { color: '#f4b400', etiqueta: 'Preocupante, inmediato', orden: 2 },
      menor:   { color: '#2e9e5b', etiqueta: 'Importancia menor', orden: 1 }
    };
    const ALIAS = { rojo: 'critico', red: 'critico', amarillo: 'urgente', yellow: 'urgente', verde: 'menor', green: 'menor' };

    const estadoEl = document.getElementById('estado');
    const estado = (t) => { estadoEl.textContent = t || ''; };

    // ---------- Mapa base ----------
    const mapa = L.map('mapa', {
      minZoom: 7, maxZoom: 19, maxBounds: LIMITES, maxBoundsViscosity: 1.0
    }).setView(CENTRO, 15);

    if (window.protomapsL) {
      protomapsL.leafletLayer({
        url: ARCHIVO_MAPA, flavor: 'light', maxDataZoom: 14, maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Protomaps'
      }).addTo(mapa);
    } else {
      estado('Falta protomaps-leaflet.js: ponlo en la misma carpeta que index.html.');
    }

    fetch(ARCHIVO_MAPA, { headers: { Range: 'bytes=0-0' } })
      .then((r) => {
        if (r.body) r.body.cancel();
        if (r.status === 404) estado('No encuentro ' + ARCHIVO_MAPA + ' en la carpeta del mapa.');
        else if (r.status !== 206) estado('Tu servidor no soporta peticiones Range. Inicia el mapa con servidor.py.');
      })
      .catch(() => estado('Abre esta página desde http://localhost:8000 (con servidor.py), no con doble clic.'));

    // Un panel por nivel: el rojo siempre queda encima del amarillo y este del verde
    Object.entries(NIVELES).forEach(([k, n]) => { mapa.createPane('p-' + k).style.zIndex = 400 + n.orden * 10; });

    const leyenda = L.control({ position: 'bottomleft' });
    leyenda.onAdd = () => {
      const d = L.DomUtil.create('div', 'leyenda');
      d.innerHTML = Object.values(NIVELES)
        .map((n) => `<div><i style="background:${n.color}"></i>${n.etiqueta}</div>`).join('');
      return d;
    };
    leyenda.addTo(mapa);

    // ---------- Utilidades ----------
    const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
    const esCoord = (p) => Array.isArray(p) && p.length === 2 && isFinite(p[0]) && isFinite(p[1]);
    const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'auto-' + (h >>> 0).toString(36); };

    function normalizarSeveridad(x) {
      let s = String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      s = ALIAS[s] || s;
      if (!NIVELES[s]) throw new Error('severidad inválida: usa "critico" (rojo), "urgente" (amarillo) o "menor" (verde)');
      return s;
    }

    // Direcciones en texto -> coordenadas (Nominatim). Una a la vez y con pausa entre peticiones.
    const cacheGeo = {};
    let cola = Promise.resolve();
    function geocodificar(texto) {
      if (cacheGeo[texto]) return Promise.resolve(cacheGeo[texto]);
      const tarea = cola.then(async () => {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(texto));
        const d = await r.json();
        if (!d.length) throw new Error('No encontré la dirección: ' + texto);
        return (cacheGeo[texto] = [+d[0].lat, +d[0].lon]);
      });
      cola = tarea.catch(() => {}).then(() => esperar(1100));
      return tarea;
    }

    // Ajusta el tramo a la calle (OSRM, servicio público de demostración)
    async function ajustarACalle(a, b) {
      const url = 'https://router.project-osrm.org/route/v1/driving/' +
        `${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`;
      try {
        const d = await (await fetch(url)).json();
        if (d.code === 'Ok') return d.routes[0].geometry.coordinates.map(([x, y]) => [y, x]);
      } catch (e) {}
      return [a, b];   // sin conexión: línea recta
    }

    // ---------- Incidentes ----------
    const capaIncidentes = L.featureGroup().addTo(mapa);
    const incidentes = new Map();   // id -> { datos, capa, huella }

    async function agregar(inc) {
      if (!inc || typeof inc !== 'object') throw new Error('Incidente inválido');
      const sev = normalizarSeveridad(inc.severidad);
      const id = String(inc.id ?? hash(JSON.stringify(inc)));

      let coords;
      if (Array.isArray(inc.puntos) && inc.puntos.length >= 2 && inc.puntos.every(esCoord)) {
        coords = inc.puntos;
      } else {
        if (!inc.desde || !inc.hasta) throw new Error('Falta "desde" y "hasta" (o "puntos") en ' + id);
        const a = esCoord(inc.desde) ? inc.desde : await geocodificar(inc.desde);
        const b = esCoord(inc.hasta) ? inc.hasta : await geocodificar(inc.hasta);
        coords = await ajustarACalle(a, b);
      }

      eliminar(id);
      const n = NIVELES[sev];
      const base = { pane: 'p-' + sev, lineCap: 'round', lineJoin: 'round' };
      const grupo = L.featureGroup([
        L.polyline(coords, { ...base, color: '#1b1f27', weight: 11, opacity: 0.35 }),   // contorno
        L.polyline(coords, { ...base, color: n.color, weight: 7, opacity: 0.95 })
      ]).addTo(capaIncidentes);

      const cont = document.createElement('div');
      const t = document.createElement('b'); t.textContent = n.etiqueta;
      const d1 = document.createElement('div'); d1.textContent = inc.texto || 'Incidente';
      const d2 = document.createElement('small');
      const f = inc.fecha ? new Date(inc.fecha) : null;
      d2.textContent = f && !isNaN(f) ? f.toLocaleString('es-MX') : (inc.fecha || '');
      cont.append(t, d1, d2);
      grupo.bindPopup(cont);

      incidentes.set(id, { datos: { ...inc, id, severidad: sev }, capa: grupo });
      return id;
    }

    function eliminar(id) {
      const i = incidentes.get(String(id));
      if (!i) return false;
      capaIncidentes.removeLayer(i.capa);
      incidentes.delete(String(id));
      return true;
    }

    function limpiar() { capaIncidentes.clearLayers(); incidentes.clear(); desdeArchivo.clear(); }
    const listar = () => [...incidentes.values()].map((i) => i.datos);

    function enfocar(id) {
      const i = incidentes.get(String(id));
      if (i) mapa.fitBounds(i.capa.getBounds(), { maxZoom: 18, padding: [40, 40] });
    }
    function enfocarTodos() {
      if (incidentes.size) mapa.fitBounds(capaIncidentes.getBounds(), { maxZoom: 18, padding: [40, 40] });
    }

    // ---------- Lectura de incidentes.json ----------
    const desdeArchivo = new Set();
    let ultimoTexto = null, leyendo = false, primeraCarga = true;

    async function sincronizar(lista) {
      const vistos = new Set();
      const avisos = [];
      for (const inc of lista) {
        const id = String(inc.id ?? hash(JSON.stringify(inc)));
        vistos.add(id);
        const huella = JSON.stringify(inc);
        if (incidentes.get(id)?.huella === huella) continue;   // sin cambios: no se vuelve a pedir nada
        try {
          await agregar({ ...inc, id });
          incidentes.get(id).huella = huella;
          desdeArchivo.add(id);
        } catch (e) { avisos.push(e.message); }
      }
      for (const id of [...desdeArchivo]) {
        if (!vistos.has(id)) { eliminar(id); desdeArchivo.delete(id); }
      }
      return avisos;
    }

    async function leerArchivo() {
      if (leyendo) return;
      leyendo = true;
      try {
        const r = await fetch(ARCHIVO_DATOS + '?t=' + Date.now(), { cache: 'no-store' });
        if (r.status === 404) return;   // todavía no hay archivo
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const texto = await r.text();
        if (texto === ultimoTexto) return;
        const lista = JSON.parse(texto);
        if (!Array.isArray(lista)) throw new Error('debe contener una lista [ ... ]');
        ultimoTexto = texto;
        const avisos = await sincronizar(lista);
        estado(incidentes.size + ' incidente(s) en el mapa.' + (avisos.length ? ' Omitidos: ' + avisos.join(' | ') : ''));
        if (primeraCarga && incidentes.size) enfocarTodos();
        primeraCarga = false;
      } catch (e) {
        estado('Error leyendo ' + ARCHIVO_DATOS + ': ' + e.message);
      } finally {
        leyendo = false;
      }
    }

    leerArchivo();
    if (SEGUNDOS_ACTUALIZAR > 0) setInterval(leerArchivo, SEGUNDOS_ACTUALIZAR * 1000);

    // ---------- Interfaz para la IA ----------
    window.mapaIncidentes = {
      agregar, eliminar, limpiar, listar, enfocar, enfocarTodos,
      ayuda: () => ({
        severidad: {
          critico: 'rojo: extrema importancia (heridos graves, riesgo de vida, bloqueo total)',
          urgente: 'amarillo: preocupante pero inmediato (requiere atención pronto, sin riesgo vital)',
          menor: 'verde: importancia menor (molestia leve, tráfico lento, daño sin riesgo)'
        },
        formato: {
          id: 'texto único (recomendado); mismo id = actualiza ese tramo',
          severidad: 'critico | urgente | menor (también rojo | amarillo | verde)',
          texto: 'descripción corta',
          fecha: 'opcional, ISO 8601',
          desde: '[lat, lng] del primer cruce, o dirección en texto',
          hasta: '[lat, lng] del segundo cruce, o dirección en texto',
          puntos: 'alternativa a desde/hasta: [[lat, lng], ...] se dibuja tal cual'
        },
        archivo: ARCHIVO_DATOS + ' (lista de incidentes, se relee cada ' + SEGUNDOS_ACTUALIZAR + ' s)'
      })
    };
  </script>
</body>
</html>
