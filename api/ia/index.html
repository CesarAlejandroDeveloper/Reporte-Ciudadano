<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respondin · Ciudad que responde</title>
<style>
  :root {
    --ink:#1c2733; --muted:#5d6b7a; --bg:#eef1f5; --card:#ffffff; --line:#d5dbe3;
    --brand:#1d4f91; --brand-ink:#ffffff; --mine:#dce9fa; --alert:#b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8edf3; --muted:#9aa8b8; --bg:#10161d; --card:#18212b; --line:#2b3745;
            --brand:#6ea3ec; --brand-ink:#0d1620; --mine:#223a5a; --alert:#ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg);
         display: flex; justify-content: center; }
  .app { width: 100%; max-width: 640px; height: 100%; display: flex; flex-direction: column; background: var(--card);
         border-inline: 1px solid var(--line); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  #terms { padding: 18px; border-bottom: 1px solid var(--line); }
  #terms label { display: flex; gap: 10px; align-items: flex-start; }
  #log { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bot  { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
  .me   { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
  .sos  { border-left: 4px solid var(--alert); }
  .note { align-self: center; color: var(--muted); font-size: .85rem; }
  form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: center; }
  input[type=text] { flex: 1; min-width: 0; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
                     font: inherit; color: var(--ink); background: var(--card); }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); padding: 10px 12px; }
  button.send { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  button.on { outline: 2px solid var(--brand); }
  button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  #foto { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Respondin</h1>
    <p>Reportes ciudadanos, trámites y seguimiento</p>
  </header>

  <div id="terms">
    <label>
      <input type="checkbox" id="acepto">
      <span>Esta conversación se guarda con fines de seguridad y seguimiento. Acepto los términos y condiciones del servicio.</span>
    </label>
  </div>

  <div id="log" aria-live="polite"></div>

  <form id="form" autocomplete="off">
    <button type="button" id="btnGps" title="Compartir mi ubicación" aria-label="Compartir mi ubicación" disabled>Ubicación</button>
    <button type="button" id="btnFoto" title="Adjuntar foto" aria-label="Adjuntar foto" disabled>Foto</button>
    <input type="file" id="foto" accept="image/jpeg,image/png,image/webp">
    <input type="text" id="texto" placeholder="Escribe tu mensaje" disabled>
    <button class="send" id="enviar" disabled>Enviar</button>
  </form>
</div>

<script>
  const API = 'chatbot.php';
  const $ = id => document.getElementById(id);
  const log = $('log'), texto = $('texto'), enviar = $('enviar');
  let sessionId = sessionStorage.getItem('respondin_sid') || '';
  let coords = null, foto = null, ocupado = false;

  function pinta(rol, txt, extra = '') {
    const d = document.createElement('div');
    d.className = 'msg ' + (rol === 'me' ? 'me' : 'bot') + ' ' + extra;
    d.textContent = txt;           // textContent: nunca interpreta HTML
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }
  function nota(txt) {
    const d = document.createElement('div'); d.className = 'note'; d.textContent = txt;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function habilita(on) {
    [texto, enviar, $('btnGps'), $('btnFoto')].forEach(e => e.disabled = !on);
  }

  async function llamar(mensaje) {
    ocupado = true; habilita(false);
    const espera = pinta('bot', 'Escribiendo…');
    const fd = new FormData();
    fd.append('mensaje', mensaje);
    fd.append('session_id', sessionId);
    fd.append('acepta_terminos', $('acepto').checked ? 'true' : 'false');
    if (coords) { fd.append('latitud', coords.latitude); fd.append('longitud', coords.longitude); }
    if (foto) fd.append('foto', foto);
    try {
      const r = await fetch(API, { method: 'POST', body: fd });
      const d = await r.json();
      espera.remove();
      if (d.session_id) { sessionId = d.session_id; sessionStorage.setItem('respondin_sid', sessionId); }
      pinta('bot', (d.respuesta || d.error || 'Sin respuesta') + (d.respuesta && d.error ? '\n[detalle: ' + d.error + ']' : ''), d.emergencia ? 'sos' : '');
      if (d.folio) nota('Folio: ' + d.folio + ' · guárdalo para consultar tu reporte');
      coords = null; foto = null;
      $('btnGps').classList.remove('on'); $('btnFoto').classList.remove('on');
    } catch (e) {
      espera.remove(); pinta('bot', 'No pude conectar con el servidor. Revisa que Apache esté encendido.');
    }
    ocupado = false; habilita(true); texto.focus();
  }

  $('acepto').addEventListener('change', async e => {
    if (!e.target.checked || sessionId) return;
    e.target.disabled = true; $('terms').style.display = 'none';
    await llamar('');            // pide el saludo inicial
  });
  if (sessionId) { $('acepto').checked = true; $('terms').style.display = 'none'; habilita(true); nota('Sesión retomada'); }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const t = texto.value.trim();
    if ((!t && !foto && !coords) || ocupado) return;
    pinta('me', t || (foto ? '[Foto adjunta]' : '[Ubicación compartida]'));
    texto.value = '';
    llamar(t);
  });

  $('btnGps').addEventListener('click', () => {
    navigator.geolocation.getCurrentPosition(
      p => { coords = p.coords; $('btnGps').classList.add('on'); nota('Ubicación lista; se envía con tu siguiente mensaje'); },
      () => nota('No se pudo obtener la ubicación. Descríbela con palabras.'),
      { enableHighAccuracy: true, timeout: 10000 });
  });
  $('btnFoto').addEventListener('click', () => $('foto').click());
  $('foto').addEventListener('change', e => {
    foto = e.target.files[0] || null;
    if (foto) { $('btnFoto').classList.add('on'); nota('Foto lista; se envía con tu siguiente mensaje'); }
  });
</script>
</body>
</html>
